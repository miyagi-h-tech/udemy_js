        // promise
        // 1 状態(ok/ng)と値
        // 2 Promiseチェーン

        // callback
        // 引数が状態 ok, ng (1つでも可)

        function promiseTest1() {
            return new Promise( ok => {
                ok('プロミス1です');
            });
        }

        console.log(promiseTest1());

        const promiseTest2 = new Promise( ok => {
            ok('プロミス2です');
        });

        console.log(promiseTest2);

        function promiseTest3(input){
            return new Promise(ok => {
                ok(`プロミス${input}です`);
            });
        }

        console.log(promiseTest3('太郎'));

        // Promiseチェーン
        // Promise .then(ok_callback, nb_callback)
        // Promise .then((ok_value) => {}, (ng_reason) => {})
        // Promise .catch(ng_callback) //NGはcatch
        // Promise .catch((ng_reason)) //NGはcatch


        //ng も追加
        // new Promise((ok, ng)={})

        console.log(1);
        promiseTest(300, 2)
        .then(change1 => promiseTest(change1, 3))
        .then(change2 => promiseTest(change2, 2))
        .catch(e => console.log(e));
        console.log(3);
        function promiseTest(pay, seconds){
            return new Promise((ok, ng) => {
                setTimeout(() => {
                    if (pay > 100) {
                    let change = pay -100;
                    console.log(`${seconds}秒、おつりは、${change}です。`);
                    ok(change);
                    }
                    ng('お金が足りません');   
                }, seconds * 1000)
            })
        }
